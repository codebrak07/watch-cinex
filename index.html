<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/ishanvi.png?v=5" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ishanvi Nig's Netflix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400;700&display=swap"
    rel="stylesheet">
  <script>
    // Polyfill & Bridge for Expo / React Native Web RCTAnimation & Native Modules
    window.NativeModules = window.NativeModules || {};
    window.RCTAnimation = window.RCTAnimation || {
      startAnimatingNode: function() {},
      stopAnimation: function() {},
      createAnimatedNode: function() {},
      dropAnimatedNode: function() {},
      setAnimatedNodeValue: function() {},
      setAnimatedNodeOffset: function() {},
      flattenAnimatedNodeOffset: function() {},
      extractAnimatedNodeOffset: function() {},
      connectAnimatedNodes: function() {},
      disconnectAnimatedNodes: function() {},
      startListeningToAnimatedNodeValue: function() {},
      stopListeningToAnimatedNodeValue: function() {},
      addAnimatedEventToView: function() {},
      removeAnimatedEventFromView: function() {},
      getValue: function() {}
    };
    window.NativeModules.NativeAnimatedModule = window.RCTAnimation;
    window.NativeModules.UIManager = window.NativeModules.UIManager || {};

    // Pop-up and New Tab Blocker for Embedded Video Players
    const originalOpen = window.open;
    window.open = function(url, target, features) {
      // Allow internal app links or explicit user interactions
      if (url && (url.includes(window.location.hostname) || url.startsWith('/') || url.startsWith('blob:'))) {
        return originalOpen.apply(this, arguments);
      }
      console.warn('[AdBlocker] Blocked popup/redirect to:', url);
      return null;
    };
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
