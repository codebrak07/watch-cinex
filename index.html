<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" type="image/png" href="/cinex.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400;700&display=swap"
    rel="stylesheet">
  <script>
    // Polyfill & Bridge for Expo / React Native Web RCTAnimation & Native Modules
    window.NativeModules = window.NativeModules || {};
    window.RCTAnimation = window.RCTAnimation || {
      startAnimatingNode: function() {},
      stopAnimation: function() {},
      createAnimatedNode: function() {},
      dropAnimatedNode: function() {},
      setAnimatedNodeValue: function() {},
      setAnimatedNodeOffset: function() {},
      flattenAnimatedNodeOffset: function() {},
      extractAnimatedNodeOffset: function() {},
      connectAnimatedNodes: function() {},
      disconnectAnimatedNodes: function() {},
      startListeningToAnimatedNodeValue: function() {},
      stopListeningToAnimatedNodeValue: function() {},
      addAnimatedEventToView: function() {},
      removeAnimatedEventFromView: function() {},
      getValue: function() {}
    };
    window.NativeModules.NativeAnimatedModule = window.RCTAnimation;
    window.NativeModules.UIManager = window.NativeModules.UIManager || {};

    // =========================================================================
    // ADVANCED AD & POPUP BLOCKING SHIELD
    // Intercepts window.open, link clickjacking, synthetic clicks, and ad redirects
    // =========================================================================
    (function() {
      // 1. Create a dummy window proxy so ad scripts think the popup succeeded and don't try fallback redirects
      const fakeWindowProxy = {
        closed: true,
        name: 'ad-shield-blocked',
        opener: null,
        parent: window,
        top: window,
        location: { href: '', replace: function() {}, assign: function() {}, reload: function() {} },
        document: { write: function() {}, close: function() {}, open: function() {}, body: {} },
        close: function() {},
        focus: function() {},
        blur: function() {},
        postMessage: function() {},
        addEventListener: function() {},
        removeEventListener: function() {}
      };

      const originalOpen = window.open;
      window.open = function(url, target, features) {
        if (typeof url === 'string') {
          // Allow internal app routes and blob URLs
          if (url.startsWith('/') || url.startsWith('blob:') || (url.includes(window.location.hostname) && !url.includes('ad'))) {
            return originalOpen.apply(this, arguments);
          }
        }
        console.warn('[AdShield] Blocked popup attempt to:', url);
        return fakeWindowProxy;
      };

      // 2. Intercept synthetic click events on ad links dynamically created by player scripts
      document.addEventListener('click', function(e) {
        const anchor = e.target.closest('a');
        if (anchor && anchor.href) {
          try {
            const destUrl = new URL(anchor.href, window.location.origin);
            if (destUrl.origin !== window.location.origin && !destUrl.protocol.startsWith('blob') && !destUrl.protocol.startsWith('data')) {
              // Block opening external ad links
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
              console.warn('[AdShield] Blocked external ad link dispatch:', anchor.href);
              return false;
            }
          } catch(err) {}
        }
      }, true);

      // Programmatic anchor .click() interceptor
      const origAnchorClick = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = function() {
        if (this.href) {
          try {
            const dest = new URL(this.href, window.location.origin);
            if (dest.origin !== window.location.origin && !dest.protocol.startsWith('blob') && !dest.protocol.startsWith('data')) {
              console.warn('[AdShield] Blocked programmatic anchor click to:', this.href);
              return;
            }
          } catch(e) {}
        }
        return origAnchorClick.apply(this, arguments);
      };

      // 3. Block auxclick (middle-click popup hijack)
      document.addEventListener('auxclick', function(e) {
        const anchor = e.target.closest('a');
        if (anchor && anchor.href) {
          try {
            const destUrl = new URL(anchor.href, window.location.origin);
            if (destUrl.origin !== window.location.origin) {
              e.preventDefault();
              e.stopPropagation();
            }
          } catch(err) {}
        }
      }, true);

      // 4. Protect against window blur hijacking (when an ad attempts to push current tab to background)
      window.addEventListener('blur', function() {
        setTimeout(function() {
          if (document.visibilityState === 'visible') {
            window.focus();
          }
        }, 150);
      });

      // 5. Protect against malicious page unload / top navigation hijacking when player is active
      window.addEventListener('beforeunload', function(e) {
        if (window.__isPlayerModalOpen) {
          e.preventDefault();
          e.returnValue = '';
        }
      });
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
